[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cit"
version = "0.1.0"
description = "Simple git clone written in python"
authors = [
  { name="AbrarShakhi", email="placeholder@email.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
cit = "cit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]